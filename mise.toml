[tools]
bun = "1.3.14"
python = "3.12"
uv = "latest"

[tasks.install]
description = "Install backend (uv) and frontend (bun) dependencies"
run = ["uv sync --project backend", "bun install --cwd frontend"]

[tasks."dev:api"]
description = "FastAPI on :14433 with reload"
dir = "backend"
run = "uv run uvicorn app.main:app --port ${PORT:-14433} --reload --reload-dir app"

[tasks."dev:web"]
description = "Astro dev server on :4321 (proxies /api to :14433)"
dir = "frontend"
run = "bunx astro dev --port 4321"

[tasks.dev]
description = "Run API + web together"
depends = ["dev:api", "dev:web"]

[tasks.build]
description = "Build the frontend into frontend/dist (served by FastAPI)"
dir = "frontend"
run = "bunx astro build"

[tasks.start]
description = "Production: one process on :14433 serving API + built UI"
depends = ["build"]
dir = "backend"
run = "uv run uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-14433}"

[tasks.score]
description = "Score engines vs ground truth: mise run score -- --gt DIR a.pdf b.pdf"
dir = "backend"
run = "uv run python scripts/score.py"

[tasks."check:a11y"]
description = "axe accessibility check (light + dark) and narrow-window layout, against a running server (BASE=...)"
dir = "frontend"
run = "bun tests/a11y.ts"

[tasks.backup]
description = "Back up the library (database + PDFs) to data/backups/: mise run backup -- [out.zip] [--no-pdfs]"
dir = "backend"
run = "uv run python -m app.backup export"

[tasks.docker]
description = "Build and start the Docker container on :14433"
run = "docker compose up -d --build"

[tasks.restore]
description = "Restore a backup: mise run restore -- FILE.zip [--mode merge|replace]  (merge = add missing documents; default)"
dir = "backend"
run = "uv run python -m app.backup import"
